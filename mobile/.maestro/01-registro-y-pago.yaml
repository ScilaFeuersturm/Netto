# 1/3: registro, onboarding, carga de una factura y pago.
# Correr las tres partes en orden: ~/.maestro/bin/maestro test .maestro/
# Requiere el email de la cuenta de prueba (uno nuevo por corrida):
#   ~/.maestro/bin/maestro test -e EMAIL=ana-$(date +%s)@example.com .maestro/
appId: io.github.scilafeuersturm.netto
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
      camera: allow
      photos: allow
# Si quedó abierto un pedido de permiso de una corrida anterior, se cierra.
- runFlow:
    when:
      visible: "Permitir|Allow"
    commands:
      - tapOn: "Permitir|Allow"

# ---- Registro ----
- extendedWaitUntil:
    visible: "Iniciá sesión"
    timeout: 60000
- tapOn: "¿No tenés cuenta? Registrate"
- assertVisible: "Creá tu cuenta"
- tapOn:
    id: "register-name"
- inputText: "Ana Pérez"
- tapOn:
    id: "register-email"
- inputText: ${EMAIL}
- tapOn:
    id: "register-password"
- inputText: "secreto123"
- tapOn:
    id: "register-confirm"
- inputText: "secreto123"
# Deslizar cierra el teclado, que si no tapa la casilla y el botón.
- scroll
- waitForAnimationToEnd
# Aceptar términos y privacidad (sin esto no se puede crear la cuenta).
- tapOn:
    id: "register-legal"
- tapOn: "Crear cuenta"
- extendedWaitUntil:
    visible: "Configuremos tu cuenta.*|.*Administrador de contraseñas de Google.*|.*Google Password Manager.*"
    timeout: 60000
# Android ofrece guardar la contraseña en Google: se rechaza (no guardar cuentas de prueba).
- runFlow:
    when:
      visible: ".*Administrador de contraseñas de Google.*|.*Google Password Manager.*"
    commands:
      - tapOn: "Ahora no|Not now"

# ---- Onboarding ----
- extendedWaitUntil:
    visible: "Configuremos tu cuenta.*"
    timeout: 60000
- assertVisible: "¡Hola, Ana!"
- tapOn:
    id: "onboarding-income-name"
- inputText: "Sueldo"
- tapOn:
    id: "onboarding-income-amount"
- inputText: "5000000"
# El teclado numérico de iOS no tiene "listo": se cierra deslizando.
- scroll
- scrollUntilVisible:
    element: "Empezar"
# Esperar a que termine el desplazamiento: en iOS, un toque durante la inercia solo la frena.
- waitForAnimationToEnd
- tapOn: "Empezar"
# Primero la app explica para qué sirven los avisos; recién después aparece el permiso del sistema.
# Si el permiso ya está concedido (Maestro lo concede de antemano en Android), no hay nada que explicar.
- extendedWaitUntil:
    visible: "¿Te avisamos antes de que venzan tus facturas\\?"
    timeout: 15000
    optional: true
- tapOn:
    text: "Activar avisos"
    optional: true
- extendedWaitUntil:
    visible: "Permitir|Allow"
    timeout: 8000
    optional: true
- tapOn:
    text: "Permitir|Allow"
    optional: true

# ---- Inicio ----
- extendedWaitUntil:
    visible: "Te queda este mes"
    timeout: 15000
- assertVisible: "Gs\\. 5\\.000\\.000|5\\.000\\.000 guaraníes"
- assertVisible: "Todavía no cargaste ningún pago.*"

# ---- Nueva factura ----
- tapOn: "Registrar"
- assertVisible: "Nuevo pago"
- tapOn:
    id: "obligation-name"
- inputText: "Luz ANDE"
- tapOn:
    id: "obligation-amount"
- inputText: "350000"
# El teclado numérico de iOS no tiene "listo": se cierra deslizando.
- scroll
- scrollUntilVisible:
    element: "Guardar"
# Esperar a que termine el desplazamiento: en iOS, un toque durante la inercia solo la frena.
- waitForAnimationToEnd
- tapOn: "Guardar"
- extendedWaitUntil:
    visible: "Luz ANDE.*"
    timeout: 10000
- assertVisible: ".*(Gs\\. 350\\.000|350\\.000 guaraníes).*"

# ---- Pagar: pasa al historial y, al ser mensual, se genera la próxima cuota ----
- scrollUntilVisible:
    element: "Pagar ahora|Marcar Luz ANDE como pagada"
    centerElement: true
- tapOn: "Pagar ahora|Marcar Luz ANDE como pagada"
- scrollUntilVisible:
    element: "Actividad reciente"
- assertVisible: "-Gs\\. 350\\.000|menos 350\\.000 guaraníes"
