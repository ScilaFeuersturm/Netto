# 2/6: pestañas en el plan gratis, perfil y cierre de sesión (usa los datos que deja la parte 1).
# Requiere el email de la cuenta de prueba (uno nuevo por corrida):
#   ~/.maestro/bin/maestro test -e EMAIL=ana-$(date +%s)@example.com .maestro/
appId: io.github.scilafeuersturm.inariko
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Inariko está bloqueado|Te queda este mes"
    timeout: 60000
# Si pasaron más de 5 minutos desde el último uso, la app pide desbloquear.
- runFlow:
    when:
      visible: "Inariko está bloqueado"
    commands:
      - tapOn:
          id: "unlock-password"
      - inputText: "secreto123"
      - pressKey: Enter
- extendedWaitUntil:
    visible: "Te queda este mes"
    timeout: 60000

# ---- Facturas ----
- tapOn:
    id: "tab-obligations"
- assertVisible: "Escanear factura"
# Los filtros están en una fila que se desplaza horizontalmente.
# Se desliza hasta ver "Pagadas" entero: tocarlo cortado en el borde no lo selecciona.
- repeat:
    while:
      notVisible:
        text: "Pagadas \\(1\\)"
    times: 3
    commands:
      - swipe:
          from: "Por vencer.*"
          direction: LEFT
      - waitForAnimationToEnd
- tapOn: "Pagadas \\(1\\)"
- assertVisible: "Luz ANDE.*"
- assertVisible: ".*Pagada.*"

# ---- Plan gratis: Ahorro, Reportes y el escáner son Premium y muestran qué incluyen ----
- tapOn:
    id: "tab-budget"
- assertVisible: "Modelos de ahorro"
- assertVisible: "Incluido en Premium"
- tapOn:
    id: "tab-history"
- assertVisible: "Reportes"
- assertVisible: "Incluido en Premium"
- tapOn: "Ver Premium"
- assertVisible: "Inariko Premium"
- assertVisible: ".*19,99 USD por año.*"
- tapOn: "Volver"
- tapOn:
    id: "tab-index"
- tapOn: "Escanear"
- assertVisible: "Escanear facturas"
- tapOn: "Cargar a mano"
- assertVisible: "Nuevo pago"
- tapOn: "Volver"

# ---- Perfil y cambio de moneda ----
- tapOn: "Perfil"
- assertVisible: "Tu perfil"
- assertVisible: ${EMAIL}
- assertVisible: "Plan gratis"
# Varias monedas es Premium: en el plan gratis se explica en lugar de mostrar el selector.
- scrollUntilVisible:
    element: "Varias monedas"
- scrollUntilVisible:
    element: "Cerrar sesión"
- tapOn: "Cerrar sesión"
