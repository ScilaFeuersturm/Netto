# 3/3: login con contraseña incorrecta y luego correcta; los datos vuelven desde la nube.
# Requiere el email de la cuenta de prueba (uno nuevo por corrida):
#   ~/.maestro/bin/maestro test -e EMAIL=ana-$(date +%s)@example.com .maestro/
appId: com.example.netto
---
# ---- Volver a entrar ----
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Iniciá sesión"
    timeout: 60000
- tapOn:
    id: "login-email"
# Android puede ofrecer contraseñas guardadas en Google: se rechaza para escribir la de prueba.
- tapOn:
    text: "No, gracias|No thanks"
    optional: true
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: "clave-incorrecta"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Email o contraseña incorrectos."
    timeout: 60000
- tapOn:
    id: "login-password"
- eraseText: 30
- inputText: "secreto123"
- pressKey: Enter
- extendedWaitUntil:
    visible: "SALDO DISPONIBLE DEL MES|.*Administrador de contraseñas de Google.*|.*Google Password Manager.*"
    timeout: 60000
# Android ofrece guardar la contraseña en Google: se rechaza (no guardar cuentas de prueba).
- runFlow:
    when:
      visible: ".*Administrador de contraseñas de Google.*|.*Google Password Manager.*"
    commands:
      - tapOn: "Ahora no|Not now"
- extendedWaitUntil:
    visible: "SALDO DISPONIBLE DEL MES"
    timeout: 60000
- assertVisible: "¡Hola, Ana!"
# Al cerrar sesión se borraron los datos del teléfono: tienen que volver desde la nube.
- extendedWaitUntil:
    visible: "Luz ANDE.*"
    timeout: 30000
- scrollUntilVisible:
    element: "-Gs. 350.000"
    centerElement: true
